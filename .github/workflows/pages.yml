name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html style.css favicon.svg js _site/
          # Pages caches files for ~10 minutes. Version every URL so a deploy never mixes old and new modules.
          v="${GITHUB_SHA::8}"
          sed -i -E "s#(from '\./[a-z-]+\.js)'#\1?v=$v'#g" _site/js/*.js
          sed -i -E "s#(src=\"js/app\.js|href=\"style\.css)\"#\1?v=$v\"#g" _site/index.html
          grep -q "app.js?v=$v" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
